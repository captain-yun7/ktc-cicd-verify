name: web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  APP: web                 # 폴더 이름 = 이미지 이름
  TRIVY_VERSION: v0.74.0

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # web은 Node 코드가 없어 npm test 대신 nginx 설정 검사. api 이름은 러너에 없으니 127.0.0.1로 알려 줌
      - name: nginx 설정 검사 (nginx -t)
        run: |
          docker run --rm --add-host api:127.0.0.1 \
            -v "$PWD/${{ env.APP }}/default.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.29-alpine nginx -t

  scan:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: 이미지 빌드 (검사용)
        run: docker build -t ${{ env.APP }}:ci ${{ env.APP }}
      # 남이 만든 Action은 태그 대신 커밋 SHA로 고정한다 (태그는 다른 코드로 옮겨 달 수 있다)
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: true
      - name: Trivy 게이트 (고칠 수 있는 CRITICAL이 있으면 실패)
        run: trivy image --exit-code 1 --severity CRITICAL --ignore-unfixed ${{ env.APP }}:ci

  push:
    needs: scan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: 이미지 이름 (GHCR는 소문자만)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/${{ env.APP }}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 빌드·올리기
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.APP }}
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ github.sha }}
            ${{ steps.img.outputs.name }}:main

  deploy-dev:
    needs: push
    runs-on: ubuntu-24.04
    permissions:
      contents: write          # 매니페스트 커밋을 push 하려면 필요
    steps:
      - uses: actions/checkout@v7
      - name: dev 매니페스트에 새 이미지 태그 기록
        run: |
          cd deploy/overlays/dev
          kustomize edit set image todo-web=ghcr.io/${GITHUB_REPOSITORY,,}/web:${GITHUB_SHA}
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy(dev): web ${GITHUB_SHA::7}"
          git pull --rebase
          git push
          # GITHUB_TOKEN으로 만든 커밋은 워크플로를 다시 실행하지 않는다 → 끝없이 돌지 않음
