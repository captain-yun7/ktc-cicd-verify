name: shipping

on:
  push:
    branches: [main]
    paths:
      - "shipping/**"
      - ".github/workflows/shipping.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write          # GHCR에 올리려면 필요

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: shipping/go.mod
          cache-dependency-path: shipping/go.sum

      - name: 테스트
        working-directory: shipping
        run: go test ./...

      - name: 이미지 이름 (GHCR는 소문자만)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/shipping" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: shipping
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ github.sha }}
            ${{ steps.img.outputs.name }}:main
