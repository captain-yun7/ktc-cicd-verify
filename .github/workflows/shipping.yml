name: shipping

on:
  push:
    branches: [main]
    paths:
      - "shipping/**"
      - "deploy/base/**"
      - ".github/workflows/shipping.yml"
  pull_request:
    paths:
      - "shipping/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  SERVICE: shipping
  K8S_NAME: shippingservice        # deploy/base 의 이미지 이름 (실습 7에서 씀)
  TRIVY_VERSION: v0.74.0

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ env.SERVICE }}/go.mod
          cache-dependency-path: ${{ env.SERVICE }}/go.sum
      - name: 단위 테스트
        working-directory: ${{ env.SERVICE }}
        run: go test ./...

  verify:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: 이미지 빌드 (검사용, amd64 한 가지)
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.SERVICE }}
          load: true
          tags: ${{ env.SERVICE }}:ci
          cache-from: type=gha,scope=${{ env.SERVICE }}
          cache-to: type=gha,scope=${{ env.SERVICE }},mode=max

      # 외부 Action은 태그 대신 커밋 SHA로 고정한다 (태그는 바꿔 달 수 있다 — 클라우드 보안 14장 공급망)
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: true

      - name: Trivy 게이트 (고칠 수 있는 CRITICAL이 있으면 실패)
        run: trivy image --exit-code 1 --severity CRITICAL --ignore-unfixed ${{ env.SERVICE }}:ci


      - name: kind 클러스터
        uses: helm/kind-action@v1
        with:
          version: v0.33.0
          cluster_name: ci

      - name: 통합 테스트 — 방금 만든 이미지로 6개 서비스 배포
        run: |
          kind load docker-image ${{ env.SERVICE }}:ci --name ci
          cd deploy/overlays/dev
          kustomize edit set image ${{ env.K8S_NAME }}=${{ env.SERVICE }}:ci
          kubectl create namespace shop-dev
          kubectl apply -k .
          kubectl -n shop-dev wait --for=condition=available deploy --all --timeout=180s
          # 통과했다고 새 이미지가 쓰인 것은 아니다 — 실제로 배포된 이미지를 확인한다
          kubectl -n shop-dev get deploy ${{ env.K8S_NAME }} -o jsonpath='{.spec.template.spec.containers[0].image}' | tee /dev/stderr | grep -qx "${{ env.SERVICE }}:ci"

      - name: 통합 테스트 — 장바구니 화면(배송비 계산에 shipping 사용)
        run: |
          kubectl -n shop-dev port-forward svc/frontend 8080:80 &
          sleep 5
          code=$(curl -s -o /dev/null -w "%{http_code}" localhost:8080/cart)
          echo "장바구니 응답: $code"
          test "$code" = 200

      - name: 실패하면 상태 남기기
        if: failure()
        run: |
          kubectl -n shop-dev get pods -o wide || true
          kubectl -n shop-dev describe pods 2>/dev/null | tail -40 || true

  push:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: 이미지 이름 (GHCR는 소문자만)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/${{ env.SERVICE }}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: arm64 이미지 안의 실행 파일이 정말 arm64인지 확인
        run: |
          docker buildx build --platform linux/arm64 -o type=local,dest=arm64-out ${{ env.SERVICE }}
          file arm64-out/src/* | tee /dev/stderr | grep -q "ARM aarch64"
      - name: 멀티아치 빌드·올리기 (amd64 + arm64)
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.SERVICE }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ github.sha }}
            ${{ steps.img.outputs.name }}:main
          cache-from: type=gha,scope=${{ env.SERVICE }}
