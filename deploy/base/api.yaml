# api(todo-api) — 이미지 이름 todo-api는 overlays/<환경>에서 실제 주소(ghcr.io/…)로 바뀐다
apiVersion: v1
kind: ConfigMap
metadata:
  name: todo-config
data:
  DB_HOST: db
  DB_USER: todo
  DB_NAME: todo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        image: todo-api
        envFrom:
        - configMapRef:
            name: todo-config
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: todo-secret
              key: DB_PASSWORD
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
  - port: 3000
